[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --html=report.html
    --self-contained-html
markers =
    smoke: Quick smoke tests to verify basic functionality
    regression: Full regression test suite
    api: API endpoint tests
    database: Database-related tests
    performance: Performance and load tests
    e2e: End-to-end integration tests
    auth: Authentication and authorization tests
    product: Product catalog tests
    order: Order management tests
    migration: Data migration validation tests
    slow: Tests that take longer than 10 seconds
    integration: Integration tests requiring external services
    unit: Unit tests with no external dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
